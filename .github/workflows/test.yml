name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Autotools conversion (REQ-007): the workflow bootstraps the GNU build
# system (`./autogen.sh`, `./configure`, `make`, `make check`) instead of
# installing and running Eldev.  The byte-compile is the
# warnings-as-errors gate (REQ-008) and `make check` runs the whole ERT
# suite (REQ-006).  `transient`/`vui` are installed into a throwaway
# package directory and handed to the build as EMACSLOADPATH (REQ-009).

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.4'
          - '30.2'
          - '31.1'
          - 'snapshot'

    # Emacs 29.4 has a known EIEIO byte-compilation bug that causes
    # invalid-function errors for cross-file defun references in
    # cl-defmethod dispatch.  Allow 29.4 to fail without blocking CI.
    continue-on-error: ${{ matrix.emacs_version == '29.4' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs ${{ matrix.emacs_version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # `make` builds the Info manual (info_TEXINFOS), so makeinfo is a
      # hard build dependency.
      - name: Install Texinfo
        run: sudo apt-get update && sudo apt-get install -y texinfo

      # bd v1.3.1 from gastownhall/beads (the repo moved from steveyegge/beads,
      # whose release URLs are dead). Bump by changing the version in the URL.
      # The beads-events-live feature consumes `bd events` (the events journal),
      # first available in 1.3.1; the parity audit also pins to this version.
      - name: Install Beads v1.3.1
        run: |
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin bd
          bd --version

      - name: Install Dolt
        run: sudo bash -c 'curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'

      - name: Verify Dolt installation
        run: dolt version

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Elisp dependencies
        run: |
          deps=$(scripts/ci-deps transient vui marginalia)
          echo "EMACSLOADPATH=$deps" >> "$GITHUB_ENV"

      # Bootstrap, configure (which discovers bd/dolt/graphviz and thus
      # selects the full suite), byte-compile with warnings as errors, and
      # run the whole ERT suite.
      - name: Bootstrap, build and test
        run: |
          ./autogen.sh
          ./configure
          make
          make check
