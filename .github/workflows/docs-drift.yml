name: Docs drift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The generated-doc drift gate runs without Eldev (REQ-008): configure
# resolves `transient`/`vui` from the installed EMACSLOADPATH, and
# scripts/dispatch-docs drives plain Emacs.  It fails when the checked-in
# dispatch reference, README table, or manual table disagree with the
# transient menu code.

jobs:
  dispatch-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Offline grep gate (REQ-015/REQ-016): the manual sources, build
      # inputs, and generated HTML must not mention the forbidden
      # host/city name.  No Emacs or dependencies needed.
      - name: Check manual for forbidden host name
        run: ./scripts/check-manual-forbidden

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - name: Install Elisp dependencies
        run: |
          deps=$(scripts/ci-deps transient vui)
          echo "EMACSLOADPATH=$deps" >> "$GITHUB_ENV"

      # Reference-completeness gate (REQ-008, REQ-009, REQ-013): every
      # user-visible command, every generated `--execute' suffix, and
      # every `defcustom' user option must have a `@deffn'/`@defopt'
      # entry in `doc/*.texi'.  This is a `:unit' ERT test, so it only
      # needs Emacs and the resolved transient/vui load path; running it
      # in this workflow makes a missing reference entry fail CI even
      # when the full `make check` matrix is not run.
      - name: Check manual reference completeness
        run: |
          emacs --batch -Q -L lisp -L lisp/test \
            -l lisp/test/beads-manual-reference-test.el \
            --eval '(ert-run-tests-batch-and-exit (quote (tag :unit)))'

      - name: Check generated dispatch docs
        run: |
          ./autogen.sh
          ./configure
          ./scripts/dispatch-docs --check
