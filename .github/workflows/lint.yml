name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/eldev
          key: ${{ runner.os }}-eldev-lint-v3-${{ hashFiles('Eldev') }}
          restore-keys: |
            ${{ runner.os }}-eldev-lint-v3-

      - name: Install Eldev
        run: curl --fail --silent --show-error --location https://raw.github.com/doublep/eldev/master/webinstall/github-eldev | sh

      # bd v1.3.0 from gastownhall/beads (the repo moved from steveyegge/beads,
      # whose release URLs are dead). Bump by changing the version in the URL.
      - name: Install Beads v1.3.0
        run: |
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin bd
          bd --version

      - name: Lint
        run: eldev -p -dtT lint
