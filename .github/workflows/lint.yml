name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Eldev is gone (REQ-007): the lint bar is `make lint`, which
# byte-compiles every lisp/*.el with warnings as errors and then runs
# package-lint under Emacs 31.1 (REQ-008).  `transient`/`vui` (build
# dependencies) and `package-lint` are installed into a throwaway package
# directory and handed to the build as EMACSLOADPATH; no workflow invokes
# Eldev.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      # `make` also builds the Info manual (info_TEXINFOS), so makeinfo is
      # required even though lint itself never renders it.
      - name: Install Texinfo
        run: sudo apt-get update && sudo apt-get install -y texinfo

      - name: Install Elisp dependencies
        run: |
          deps=$(scripts/ci-deps transient vui marginalia package-lint)
          echo "EMACSLOADPATH=$deps" >> "$GITHUB_ENV"

      - name: Bootstrap, build and lint
        run: |
          ./autogen.sh
          ./configure
          make
          make lint
