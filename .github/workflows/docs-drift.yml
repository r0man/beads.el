name: Docs drift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dispatch-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/eldev
          key: ${{ runner.os }}-eldev-docs-v1-${{ hashFiles('Eldev') }}
          restore-keys: |
            ${{ runner.os }}-eldev-docs-v1-

      - name: Install Eldev
        run: curl --fail --silent --show-error --location https://raw.github.com/doublep/eldev/master/webinstall/github-eldev | sh

      - name: Install dependencies
        run: eldev -p prepare test

      # The dispatch reference, the README dispatch table, and the manual
      # maintenance table are generated from the transient menu code.  This
      # step fails when the checked-in docs and the code disagree (plan F2,
      # large item 12).  The same check also runs as a :unit test in the
      # Test workflow; this job makes the failure name obvious.
      - name: Check generated dispatch docs
        run: ./scripts/dispatch-docs --check
