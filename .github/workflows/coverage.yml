name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Coverage without Eldev (REQ-007, REQ-008): scripts/coverage drives
# undercover under plain Emacs with source loading (build-aux/beads-coverage.el)
# and runs the `:unit' subset.  The old `eldev -s ... -U
# coverage/codecov.json '(not (tag :integration))' invocation is replaced,
# while EMACS_TEST_JUNIT_REPORT, the Codecov uploads and the `:integration'
# skip are preserved.  Undercover is installed with the other Elisp
# dependencies (REQ-009).

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - name: Install Elisp dependencies
        run: |
          deps=$(scripts/ci-deps transient vui marginalia undercover)
          echo "EMACSLOADPATH=$deps" >> "$GITHUB_ENV"

      # The `:unit' selector skips `:integration' tests, but some unit
      # suites still resolve the bd executable (or spawn it through an
      # unmocked process call), so bd/dolt/graphviz must be on PATH as
      # they were before the autotools migration.  Keep these steps in
      # sync with test.yml.
      - name: Install Beads v1.3.1
        run: |
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin bd
          bd --version

      - name: Install Dolt
        run: sudo bash -c 'curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'

      - name: Verify Dolt installation
        run: dolt version

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run tests with coverage
        # scripts/coverage writes coverage/codecov.json (undercover,
        # codecov format) and coverage/junit.xml (from
        # EMACS_TEST_JUNIT_REPORT) and skips :integration: those tests
        # exercise bd/dolt, not Emacs Lisp, so they add no coverage.
        run: |
          CI=true EMACS_TEST_JUNIT_REPORT="$GITHUB_WORKSPACE/coverage/junit.xml" \
            ./scripts/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: coverage/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
